<!doctype html>
<html lang="zh-CN" data-system="chromatic-modular-grid" data-theme="cobalt-coral-lime">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chromatic Modular Grid Seed</title>
  <link rel="stylesheet" href="fonts/keke-fonts.css" />
  <link rel="stylesheet" href="themes/chromatic-modular-grid.css" />
  <style>
    /* Chromatic Modular Grid: layout and themes are intentionally independent.
       HARD RULE: semantic illustrations and workflow diagrams must be inserted GPT Image 2 bitmap assets.
       Do not recreate them from SVG/HTML/CSS; reserve code-native shapes for the frame, dividers, and tiny accents.
       Compose each bitmap for the actual image bay, with a safe margin so no meaningful subject is edge-cropped at placement. */
    * { box-sizing:border-box; }
    html,body { margin:0; padding:0; }
    body { background:#202020; color:var(--ink); font-family:"Keke Noto Sans SC","Keke Inter",sans-serif; padding:48px; }
    .sheet { display:flex; flex-direction:column; align-items:center; gap:48px; }
    .poster { width:1080px; height:1440px; overflow:hidden; position:relative; background:var(--paper); color:var(--ink); }
    .poster::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.18; background-image:linear-gradient(90deg,transparent 0 23.7%,var(--line) 23.7% 23.82%,transparent 23.82% 100%),linear-gradient(transparent 0 6.35%,var(--line) 6.35% 6.48%,transparent 6.48% 100%); }
    .brand-signature::before { content:"「两克伴」出品"; }
    .frame { height:100%; position:relative; z-index:1; padding:54px 58px 44px; display:flex; flex-direction:column; }
    .masthead,.foot { min-height:56px; display:grid; grid-template-columns:1fr 1.3fr 1fr; gap:18px; align-items:center; border-bottom:1px solid var(--line); font-family:"Keke IBM Plex Mono",monospace; font-size:18px; letter-spacing:.06em; text-transform:uppercase; }
    .masthead .issue { text-align:center; color:var(--primary); font-weight:700; }
    .masthead .brand { display:flex; gap:12px; align-items:center; font-family:"Keke Noto Sans SC",sans-serif; font-size:20px; letter-spacing:0; text-transform:none; }
    .brand-mark { width:23px; height:23px; background:var(--primary); border-radius:5px; position:relative; }
    .brand-mark::after { content:""; position:absolute; inset:6px; border:2px solid var(--paper); border-radius:2px; }
    .masthead .page { text-align:right; color:var(--muted); }
    .cover-grid { display:grid; grid-template-columns:44% 56%; height:820px; flex:0 0 820px; border-bottom:1px solid var(--line); }
    .cover-copy { padding:50px 36px 24px 0; display:flex; flex-direction:column; }
    .eyebrow { margin:0 0 20px; color:var(--primary); font-family:"Keke IBM Plex Mono",monospace; font-size:20px; letter-spacing:.12em; }
    .hero-title { margin:0; font-family:"Keke Source Han Sans SC","Keke Noto Sans SC",sans-serif; font-size:110px; line-height:1.04; letter-spacing:-.05em; font-weight:900; max-width:430px; }
    .hero-title .accent { color:var(--primary); }
    .dek { margin:24px 0 0; max-width:350px; font-size:25px; line-height:1.3; color:var(--muted); }
    .thesis { margin-top:22px; border-top:4px solid var(--ink); padding-top:15px; font-size:23px; font-weight:760; line-height:1.25; }
    /* HARD RULE — Cover visual integrity: never place a partial, cropped, or unreadable third-party screenshot here. First locate a complete source asset. If none fits the portrait bay intact, generate a topic-matched bitmap asset with GPT Image 2; keep original screenshots only as inspectable source proof. */
    .visual-bay { margin:34px 0 28px 20px; position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line); }
    .visual-bay::before { content:""; position:absolute; inset:0; background:linear-gradient(135deg,transparent 0 49.8%,rgba(23,23,25,.13) 49.8% 50.2%,transparent 50.2% 100%),repeating-linear-gradient(90deg,transparent 0 81px,rgba(23,23,25,.1) 81px 82px); }
    .visual-title { position:absolute; top:28px; left:28px; z-index:2; font-family:"Keke IBM Plex Mono",monospace; font-size:17px; letter-spacing:.1em; color:var(--muted); }
    .module { position:absolute; display:grid; place-items:center; border:1px solid var(--ink); background:var(--paper); box-shadow:10px 10px 0 rgba(23,23,25,.09); }
    .module.a { width:220px; height:286px; left:48px; top:124px; background:var(--primary); color:var(--on-primary); transform:rotate(-3deg); }
    .module.b { width:255px; height:190px; right:42px; top:212px; background:var(--paper); transform:rotate(4deg); }
    .module.c { width:170px; height:152px; left:175px; bottom:52px; background:var(--secondary); transform:rotate(2deg); }
    .module .glyph { font-size:112px; line-height:1; font-weight:900; letter-spacing:-.12em; }
    .module .mini { padding:18px; font-family:"Keke IBM Plex Mono",monospace; font-size:17px; line-height:1.35; letter-spacing:.04em; }
    .orb { width:126px; height:126px; border-radius:50%; background:var(--signal); border:1px solid var(--ink); position:absolute; right:65px; bottom:88px; }
    .orb::after { content:""; position:absolute; inset:31px; border:3px solid var(--ink); border-radius:50%; }
    .content-rail { display:grid; grid-template-columns:1.1fr .95fr .95fr; min-height:0; flex:1; border-bottom:1px solid var(--line); }
    .rail-intro,.rail-proof,.rail-note { min-height:0; padding:24px 24px 22px 0; border-right:1px solid var(--line); }
    .rail-proof,.rail-note { padding-left:25px; }
    .rail-note { border-right:0; }
    .section-index { font-family:"Keke IBM Plex Mono",monospace; color:var(--primary); font-size:18px; letter-spacing:.11em; }
    .rail-title { margin:27px 0 15px; font-size:43px; line-height:1.03; letter-spacing:-.04em; }
    .rail-copy { margin:0; font-size:22px; line-height:1.42; color:var(--muted); }
    /* Cover rail rule: use a readable evidence index instead of a second decorative image tile. Keep proof-window for inspectable content-page proof only. */
    .evidence-index .evidence-list { margin-top:22px; border-top:1px solid var(--line); }
    .evidence-index .evidence-item { display:grid; grid-template-columns:50px 1fr; align-items:center; min-height:48px; border-bottom:1px solid var(--line); }
    .evidence-index .evidence-item b { font-family:"Keke IBM Plex Mono",monospace; font-size:20px; color:var(--primary); }
    .evidence-index .evidence-item span { font-size:23px; font-weight:700; }
    .evidence-index .evidence-note { margin-top:17px; font-size:19px; line-height:1.35; color:var(--muted); }
    .semantic-art { padding:0; background:var(--surface); }
    .semantic-art img { display:block; width:100%; height:100%; object-fit:cover; object-position:center; }
    .proof-chip { display:inline-flex; margin-top:20px; padding:8px 10px; background:var(--signal); font-family:"Keke IBM Plex Mono",monospace; font-size:15px; font-weight:700; }
    .proof-window { height:151px; margin-top:21px; position:relative; overflow:hidden; border:1px solid var(--ink); background:var(--ink); }
    .proof-window::before { content:""; position:absolute; width:190px; height:190px; border:18px solid var(--primary); border-radius:50%; left:-28px; top:-52px; }
    .proof-window::after { content:""; position:absolute; width:235px; height:38px; background:var(--secondary); right:-22px; bottom:26px; transform:rotate(-16deg); }
    .swatch-row { display:flex; gap:12px; margin-top:26px; }
    .swatch { width:48px; height:48px; border:1px solid var(--ink); }
    .swatch:nth-child(1){background:var(--primary)} .swatch:nth-child(2){background:var(--secondary)} .swatch:nth-child(3){background:var(--signal)} .swatch:nth-child(4){background:var(--surface)}
    .foot { margin-top:auto; border-top:1px solid var(--line); border-bottom:0; color:var(--muted); }
    .foot .brand-signature { justify-self:center; font-family:"Keke Noto Sans SC",sans-serif; font-size:18px; color:var(--ink); text-transform:none; letter-spacing:0; }
    .foot .save { text-align:right; color:var(--primary); font-weight:700; }

    /* Content-page primitives. */
    .content-head { display:grid; grid-template-columns:1fr auto; padding:48px 0 25px; border-bottom:1px solid var(--line); }
    .content-title { margin:10px 0 0; font-family:"Keke Source Han Sans SC","Keke Noto Sans SC",sans-serif; font-size:75px; line-height:1.12; letter-spacing:-.045em; font-weight:900; max-width:740px; }
    .content-title em { color:var(--secondary); font-style:normal; }
    .content-kicker { font-family:"Keke IBM Plex Mono",monospace; font-size:18px; color:var(--primary); letter-spacing:.1em; }
    .content-badge { align-self:end; width:168px; height:168px; display:grid; place-items:center; background:var(--primary); color:var(--on-primary); font-family:"Keke IBM Plex Mono",monospace; font-size:24px; font-weight:700; transform:rotate(3deg); }
    .content-main { display:grid; grid-template-columns:1.26fr .74fr; gap:28px; padding:31px 0; border-bottom:1px solid var(--line); }
    .evidence-map { height:535px; position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line); }
    .evidence-map .map-label { position:absolute; top:24px; left:25px; font-family:"Keke IBM Plex Mono",monospace; font-size:17px; color:var(--muted); }
    .evidence-map .route { position:absolute; height:4px; background:var(--ink); transform-origin:left center; }
    .route.r1 { width:390px; left:72px; top:238px; transform:rotate(-17deg); } .route.r2 { width:278px; left:343px; top:140px; transform:rotate(49deg); background:var(--primary); } .route.r3 { width:216px; left:284px; top:347px; transform:rotate(26deg); background:var(--secondary); }
    .node { position:absolute; display:grid; place-items:center; border:1px solid var(--ink); border-radius:50%; background:var(--paper); font-family:"Keke IBM Plex Mono",monospace; font-size:18px; font-weight:700; }
    .node.n1{left:53px;top:192px;width:96px;height:96px;background:var(--signal)} .node.n2{left:432px;top:92px;width:128px;height:128px;background:var(--primary);color:var(--on-primary)} .node.n3{right:51px;bottom:71px;width:145px;height:145px;background:var(--secondary)} .node.n4{left:236px;bottom:54px;width:104px;height:104px;}
    .evidence-side { display:flex; flex-direction:column; gap:18px; }
    .evidence-stat { padding:20px 18px; border:1px solid var(--line); background:var(--paper); }
    .evidence-stat b { display:block; font-size:56px; line-height:.85; letter-spacing:-.07em; color:var(--primary); }
    .evidence-stat span { display:block; margin-top:13px; font-size:21px; line-height:1.25; font-weight:700; }
    .evidence-stat p { margin:8px 0 0; font-size:18px; line-height:1.35; color:var(--muted); }
    .evidence-stat.hot { background:var(--ink); color:var(--paper); border-color:var(--ink); } .evidence-stat.hot b { color:var(--signal); } .evidence-stat.hot p { color:rgba(244,241,233,.75); }
    .takeaway-strip { display:grid; grid-template-columns:88px 1fr auto; align-items:center; gap:22px; padding:25px 0 20px; }
    .takeaway-icon { width:70px; height:70px; display:grid; place-items:center; background:var(--secondary); border:1px solid var(--ink); font-size:42px; font-weight:900; }
    .takeaway-strip p { margin:0; max-width:640px; font-size:27px; line-height:1.23; font-weight:760; }
    .takeaway-tag { padding:9px 10px; background:var(--signal); font-family:"Keke IBM Plex Mono",monospace; font-size:15px; font-weight:700; }
  </style>
</head>
<body>
  <main class="sheet">
    <!-- POSTERS_HERE -->
  </main>
</body>
</html>
